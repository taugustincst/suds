name: Release
# Uses no marketplace actions. Refuses to release a commit whose CI did not pass (the `gate` job). Creates the tag + GitHub Release with the source zip, then asks web-app.yml to
# publish the web app for that tag. The native apps and desktop launchers were removed in 1.9.3
# (docs/PLATFORM.md): nothing else is built or attached.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'release' to publish the version in package.json"
        required: true
        default: ''
      # The release policy (docs/RELEASE.md, "Release cadence"): a patch release carries no migration, no new
      # permission and no new route, and a feature (minor or major) release comes at most once every 28 days.
      # scripts/release-policy.js refuses a release that breaks either, unless policy_exception is set to the
      # reason, which is then printed at the top of the release notes. Leave empty for no exception.
      policy_exception:
        description: "Only to release against the release policy (a PATCH release adding a migration, permission or route, or a feature release within 28 days of the last): the reason (printed at the top of the release notes)"
        required: false
        default: ''
      # The same, under its name before 1.13.1 (patch releases only then); kept so a saved dispatch still works.
      allow_patch_changes:
        description: "Earlier name of policy_exception (the same effect)"
        required: false
        default: ''
# The Node 22 the release is tested and packaged on: the release ci.yml pins, with the same checksum.
env:
  NODE22_VERSION: v22.23.3
  NODE22_SHA256: df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de
permissions:
  contents: write
  # `gh workflow run web-app.yml` below: a release this workflow creates with GITHUB_TOKEN does not fire the
  # `release` event for other workflows, so the web app publish is started explicitly.
  actions: write
jobs:
  # The release gate. Nothing is built or published unless CI (ci.yml) concluded success for this exact
  # commit, with the test, browser (the whole browser suite: accessibility, a11y-round4 and the rest), node24
  # and dr-drill jobs all green (scripts/release-gate.js; docs/RELEASE.md, "Release gate"). It waits for CI
  # still running on the commit, up to an hour. WebKit stays advisory.
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.confirm == 'release'
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the gate script at the commit being released
        run: git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
      - name: CI passed for this exact commit
        working-directory: src
        run: node scripts/release-gate.js "${GITHUB_SHA}"
      # A patch bump may not add a migration, permission or route, and a minor or major bump may not come within
      # 28 days of the previous feature release (scripts/release-policy.js compares with the previous release
      # tags and their dates). The exception arrives through the environment, never pasted into the script.
      - name: Release policy (patch releases add no migration, permission or route; feature releases at most every 28 days)
        working-directory: src
        env:
          RELEASE_POLICY_EXCEPTION: ${{ github.event.inputs.policy_exception }}
          ALLOW_PATCH_CHANGES: ${{ github.event.inputs.allow_patch_changes }}
        run: |
          git fetch --quiet --depth 1 origin '+refs/tags/v*:refs/tags/v*'
          node scripts/release-policy.js
  release:
    needs: gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.confirm == 'release'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        run: git clone --branch "${GITHUB_REF_NAME}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" src
      # The gate checked GITHUB_SHA. A branch that moved since (workflow_dispatch) would release a commit CI
      # never passed, so release exactly the gated commit or nothing.
      - name: Release exactly the commit the gate checked
        working-directory: src
        run: |
          git checkout --quiet "${GITHUB_SHA}" || { echo "::error::${GITHUB_SHA} is not on ${GITHUB_REF_NAME}"; exit 1; }
          [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ] || { echo "::error::Checked out $(git rev-parse HEAD), gated ${GITHUB_SHA}"; exit 1; }
      # These were one `&&`/`||` chain. Both operators bind at the same precedence and associate left, so a
      # failing `npm test` fell through to the `echo` and the step exited 0 — releases were published with
      # failing tests. They are separate steps now, and a stale kernel fails rather than warns.
      - name: Install Node 22 (pinned version, pinned checksum)
        run: |
          file="node-${NODE22_VERSION}-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://nodejs.org/dist/${NODE22_VERSION}/${file}"
          echo "${NODE22_SHA256}  ${file}" | sha256sum -c - || { echo "::error::${file} does not match the SHA-256 pinned in the workflow"; exit 1; }
          mkdir -p node22 && tar -xJf "$file" -C node22 --strip-components=1
          echo "$RUNNER_TEMP/node22/bin" >> "$GITHUB_PATH"
      - name: Node is the pinned release, of the major .nvmrc names
        working-directory: src
        run: |
          want="$(tr -d '[:space:]' < .nvmrc)"; have="$(node -p 'process.versions.node.split(".")[0]')"
          node --version; [ "$have" = "$want" ] || { echo "::error::Node $have is running but .nvmrc pins major $want"; exit 1; }
          [ "$(node --version)" = "$NODE22_VERSION" ] || { echo "::error::$(node --version) is running, not the pinned $NODE22_VERSION"; exit 1; }
      - name: Install
        working-directory: src
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: src
        run: npm test
      - name: Verify the committed local kernel matches its sources
        working-directory: src
        run: |
          npm run build:local
          git diff --exit-code -- public/local server/schema-text.js public/sw.js || {
            echo "::error::The committed kernel is stale; the release zip would ship it. Run 'npm run build:local' and commit."
            exit 1
          }
      - name: Package and publish
        working-directory: src
        env:
          RELEASE_POLICY_EXCEPTION: ${{ github.event.inputs.policy_exception }}
          ALLOW_PATCH_CHANGES: ${{ github.event.inputs.allow_patch_changes }}
        run: |
          ver="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "$ver" ]; then echo "Tag ${GITHUB_REF_NAME} does not match package.json $ver"; exit 1; fi
          node scripts/package.js "suds-$ver.zip"
          # A checksum beside the zip: docs/DEPLOYMENT.md tells an installer to compare it before unpacking.
          sha256sum "suds-$ver.zip" > "suds-$ver.zip.sha256"
          notes=$(awk -v v="${ver#v}" '/^## /{p = index($0, v) > 0} p' CHANGELOG.md)
          # A policy exception (already checked in the gate) is stated at the top of the notes, with its reason.
          # The tags and their dates are needed for the feature-release interval, as in the gate.
          git fetch --quiet --depth 1 origin '+refs/tags/v*:refs/tags/v*' || true
          node scripts/release-policy.js --notes-out "$RUNNER_TEMP/policy-notes.md"
          if [ -s "$RUNNER_TEMP/policy-notes.md" ]; then notes="$(cat "$RUNNER_TEMP/policy-notes.md")"$'\n\n'"${notes}"; fi
          if gh release view "$ver" >/dev/null 2>&1; then gh release upload "$ver" "suds-$ver.zip" "suds-$ver.zip.sha256" --clobber; else
            gh release create "$ver" "suds-$ver.zip" "suds-$ver.zip.sha256" --target "$(git rev-parse HEAD)" --title "SUDS $ver" --notes "${notes:-See CHANGELOG.md}"; fi
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/$ver"
      # Only after the tests passed and the release exists. A release (or tag) this workflow creates with
      # GITHUB_TOKEN starts no other workflow, so the web app publish is asked for explicitly. A tag a person pushed
      # also starts web-app.yml directly; its concurrency group runs the two one after the other, and the
      # second simply republishes the same tag.
      - name: Publish the web app for this release
        working-directory: src
        run: |
          ver="v$(node -p "require('./package.json').version")"
          gh workflow run web-app.yml --ref "$ver"
          echo "Started the web app publish for $ver. QA: open it and check the on-screen version reads ${ver#v}."
      - name: Release QA reminder
        run: |
          echo "### Release QA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Check the on-screen version (footer / version.json) on the web app and on a pilot server after deploy." >> "$GITHUB_STEP_SUMMARY"
          echo "- Run the real-device checklist in docs/ADOPTION.md (2 iPhones, 2 Androids) before the wider rollout." >> "$GITHUB_STEP_SUMMARY"
