# Override for docker-compose.yml: the keys as secrets (files), not environment variables (deploy/docker/README.md).
#   docker compose -f docker-compose.yml -f deploy/docker/docker-compose.secrets.yml up -d
# SUDS reads each <NAME>_FILE (server/config.js) and never copies the value into its environment. Remove the keys
# from .env when you use this.
services:
  suds:
    secrets: [suds_encryption_key, suds_index_key, suds_backup_key, suds_signing_key]
    environment:
      SUDS_ENCRYPTION_KEY_FILE: /run/secrets/suds_encryption_key
      SUDS_INDEX_KEY_FILE: /run/secrets/suds_index_key
      SUDS_BACKUP_KEY_FILE: /run/secrets/suds_backup_key
      SUDS_SIGNING_KEY_FILE: /run/secrets/suds_signing_key
      LOCAL_MODE_ENABLED: "false"
      MFA_REQUIRED_ROLES: admin,supervisor,clinician,navigator,finance,readonly
secrets:
  suds_encryption_key:
    file: /etc/suds/credentials/suds_encryption_key
  suds_index_key:
    file: /etc/suds/credentials/suds_index_key
  suds_backup_key:
    file: /etc/suds/credentials/suds_backup_key
  suds_signing_key:
    file: /etc/suds/credentials/suds_signing_key
