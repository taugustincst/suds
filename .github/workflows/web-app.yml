name: Web app
# Publishes the standalone, browser-only build (scripts/build-static-site.js) to GitHub Pages: a public
# URL that needs no office server, no Node process and no database — everything runs in the visitor's own
# browser. Uses no marketplace actions: the site is pushed to a gh-pages branch with plain git and Pages
# is enabled with `gh api`, both already on the hosted runner.
#
# Published on releases only, never on a push to main: the web app is a public URL, and unreleased code does
# not belong on one (docs/WEB_APP.md, "When it is published"). It runs when a v* tag is pushed, when a
# release is published by a person, and when release.yml starts it with `gh workflow run` — a release that
# workflow creates with GITHUB_TOKEN fires no `release` event for other workflows, so it has to be asked.
# workflow_dispatch also lets the product owner republish a given tag by hand (Run workflow → pick the tag).
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch: {}
# A tag push, a release and release.yml's dispatch can all arrive for the same version; publish them one
# at a time rather than racing two force-pushes to gh-pages.
concurrency:
  group: web-app-pages
  cancel-in-progress: false
permissions:
  contents: write
  # The dedicated scope for standing Pages up and deploying to it; contents: write alone was not enough
  # ("Resource not accessible by integration" from the Pages API).
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
      # The build also downloads each starter-directory provider's picture into _site/region-pictures/ (the
      # runner has internet access; a phone's browser cannot fetch them from the providers' sites itself).
      # Best effort: a provider site that fails is left out, and the step summary says how many made it.
      - name: Build the standalone site
        working-directory: src
        env:
          SUDS_REGION_PICTURES: fetch
        run: |
          npm ci --no-audit --no-fund && node scripts/build-static-site.js _site | tee /tmp/build.log
          grep '^\[suds\] region pictures' /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || echo "No provider pictures were bundled." >> "$GITHUB_STEP_SUMMARY"
      # The web app is QA'd by the version it shows on screen (docs/RELEASE.md), so say which one this is and
      # refuse to publish a tag whose package.json disagrees with it.
      - name: Version being published
        working-directory: src
        run: |
          ver="$(node -p "require('./package.json').version")"
          echo "Publishing SUDS $ver (ref ${GITHUB_REF_NAME}, commit ${GITHUB_SHA})"
          case "${GITHUB_REF_NAME}" in v*) [ "${GITHUB_REF_NAME}" = "v$ver" ] || { echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json $ver"; exit 1; };; esac
          if [ -f _site/version.json ]; then
            grep -q "\"$ver\"" _site/version.json || { echo "::error::_site/version.json does not carry $ver"; cat _site/version.json; exit 1; }
          fi
          echo "### Web app: SUDS $ver" >> "$GITHUB_STEP_SUMMARY"
          echo "Check that the on-screen version reads $ver before signing off the release QA." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify it actually boots with no backend
        working-directory: src
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.1 && npx playwright install --with-deps chromium
          node scripts/serve-static.js _site 8877 & echo $! > /tmp/static.pid
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8877/ >/dev/null && break; sleep 0.5; done
          SUDS_STATIC_URL=http://127.0.0.1:8877 node scripts/ui/static-site.mjs
          kill "$(cat /tmp/static.pid)" 2>/dev/null || true
      - name: Publish to the gh-pages branch
        working-directory: src
        run: |
          cd _site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          touch .nojekyll  # Pages runs everything through Jekyll by default; this app needs none of that
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
      - name: Enable GitHub Pages, if it is not already
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "Pages already enabled."
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" 2>&1 && echo "Pages enabled." || {
              echo "::warning::Could not enable Pages automatically (the token may lack the 'pages' permission). The site is pushed to gh-pages — enable it once by hand: Settings > Pages > Source: Deploy from a branch > gh-pages > / (root)."
            }
          fi
      - name: Print the URL
        run: |
          IFS='/' read -r _ owner repo <<< "/${GITHUB_REPOSITORY}"
          echo "https://${owner}.github.io/${repo}/"
