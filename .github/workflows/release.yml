name: Release
# Uses no marketplace actions. Creates the tag + GitHub Release with the source zip (and the Android APK if built).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'release' to publish the version in package.json"
        required: true
        default: ''
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.confirm == 'release'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        run: git clone --branch "${GITHUB_REF_NAME}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" src
      # These were one `&&`/`||` chain. Both operators bind at the same precedence and associate left, so a
      # failing `npm test` fell through to the `echo` and the step exited 0 — releases were published with
      # failing tests. They are separate steps now, and a stale kernel fails rather than warns.
      - name: Install
        working-directory: src
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: src
        run: npm test
      - name: Verify the committed local kernel matches its sources
        working-directory: src
        run: |
          npm run build:local
          git diff --exit-code -- public/local server/schema-text.js public/sw.js || {
            echo "::error::The committed kernel is stale; the release zip would ship it. Run 'npm run build:local' and commit."
            exit 1
          }
      - name: Package and publish
        working-directory: src
        run: |
          ver="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "$ver" ]; then echo "Tag ${GITHUB_REF_NAME} does not match package.json $ver"; exit 1; fi
          node scripts/package.js "suds-$ver.zip"
          notes=$(awk -v v="${ver#v}" '/^## /{p = index($0, v) > 0} p' CHANGELOG.md)
          if gh release view "$ver" >/dev/null 2>&1; then gh release upload "$ver" "suds-$ver.zip" --clobber; else
            gh release create "$ver" "suds-$ver.zip" --target "$(git rev-parse HEAD)" --title "SUDS $ver" --notes "${notes:-See CHANGELOG.md}"; fi
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/$ver"
