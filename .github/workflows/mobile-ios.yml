# DEPRECATED — the native iOS app is deprecated as of SUDS 1.8.0 and will be removed in a later release.
# The web application served by the office SUDS server is the only supported client; see docs/PLATFORM.md.
# This workflow no longer runs on tags, pushes or pull requests. It can still be started by hand from the
# Actions tab for evaluation, and only for that.
name: iOS app (deprecated)
# Compiles the iOS app on a macOS runner (simulator build, no signing).
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
      - name: Build for simulator
        working-directory: src/mobile/ios
        run: |
          xcodebuild -version
          xcodebuild -project SUDS.xcodeproj -target SUDS -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build | tail -40
