name: Android app
on:
  push:
    tags: ['v*']
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        working-directory: mobile/android
        env:
          SUDS_KEYSTORE: ${{ secrets.SUDS_KEYSTORE_PATH }}
          SUDS_KEYSTORE_PASSWORD: ${{ secrets.SUDS_KEYSTORE_PASSWORD }}
          SUDS_KEY_ALIAS: ${{ secrets.SUDS_KEY_ALIAS }}
          SUDS_KEY_PASSWORD: ${{ secrets.SUDS_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.SUDS_KEYSTORE_BASE64 }}" ]; then echo "${{ secrets.SUDS_KEYSTORE_BASE64 }}" | base64 -d > /tmp/suds.jks; export SUDS_KEYSTORE=/tmp/suds.jks; fi
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release*.apk ../../SUDS-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: SUDS-android-apk, path: SUDS-android.apk }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${GITHUB_REF_NAME}" SUDS-android.apk --clobber || echo "release not created yet; APK is available as a workflow artifact"
