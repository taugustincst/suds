name: CI
# Uses no marketplace actions so it runs under a restrictive Actions policy.
on: [push, pull_request]
# Read-only (1.16.4; engineering review of 1.16.3, L4): CI runs npm ci and the browser suite on every push and
# pull request branch, and needs only to read the repository and its tags. Without this line it inherited the
# repository's default token, which is write until the owner makes it read-only (docs/RELEASE.md, step 4).
permissions:
  contents: read
# The Node 22 every job but node24 and webkit runs on: an exact release, downloaded and checked against a
# SHA-256 pinned HERE (as node24's is), not whatever Node 22 the runner image carries that week, which only
# the major was checked against until 1.14.0 - so no push is tested on a different Node from the one before
# it without a commit saying so. release.yml pins the same release. To bump it (docs/RELEASE.md, "Bumping the
# pinned Node versions"): the version, and the linux-x64 .tar.xz line of https://nodejs.org/dist/<version>/
# SHASUMS256.txt after checking its signature; change both lines here and in release.yml in one commit.
# test/release-gate.test.js checks their shape. Node 22 leaves maintenance at the end of April 2027
# (docs/DEPLOYMENT.md, "Node.js support and the move to 24").
env:
  NODE22_VERSION: v22.23.3
  NODE22_SHA256: df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
      # No setup-node action (marketplace actions are off): the pinned Node 22 (above) is installed, and checked
      # to be the major .nvmrc, the Dockerfile and package.json's engines field all agree on.
      - name: Install Node 22 (pinned version, pinned checksum)
        run: |
          file="node-${NODE22_VERSION}-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://nodejs.org/dist/${NODE22_VERSION}/${file}"
          echo "${NODE22_SHA256}  ${file}" | sha256sum -c - || { echo "::error::${file} does not match the SHA-256 pinned in the workflow"; exit 1; }
          mkdir -p node22 && tar -xJf "$file" -C node22 --strip-components=1
          echo "$RUNNER_TEMP/node22/bin" >> "$GITHUB_PATH"
      - name: Node is the pinned release, of the major .nvmrc names
        working-directory: src
        run: |
          want="$(tr -d '[:space:]' < .nvmrc)"; have="$(node -p 'process.versions.node.split(".")[0]')"
          node --version; [ "$have" = "$want" ] || { echo "::error::Node $have is running but .nvmrc pins major $want"; exit 1; }
          [ "$(node --version)" = "$NODE22_VERSION" ] || { echo "::error::$(node --version) is running, not the pinned $NODE22_VERSION"; exit 1; }
      - name: Install
        working-directory: src
        run: npm ci --no-audit --no-fund
      # test/migration-order.test.js compares server/db.js's migrations with the previous release tag's (a
      # released migration keeps its position; ADR-0007), so the tags are fetched (each at depth 1) and the
      # test is told it may not skip for want of them.
      - name: Fetch the release tags
        working-directory: src
        run: git fetch --quiet --depth 1 origin '+refs/tags/v*:refs/tags/v*'
      - name: Test
        working-directory: src
        env:
          SUDS_REQUIRE_RELEASE_TAGS: '1'
        run: npm test
      # The release zip is built with `git archive`, so it ships the *committed* kernel, not the one built
      # during the release. A stale commit therefore reaches local-mode devices silently. Fail the build instead.
      # Since 1.16.1 the build is path-independent (scripts/kernel-build-options.js: preserveSymlinks, and
      # build-local.js builds from the repository root), so a kernel built in a worktree with a symlinked
      # node_modules, or from another directory, is byte-identical to this one: a difference here is a real one.
      - name: Local kernel and generated schema match their sources
        working-directory: src
        run: |
          npm run build:local
          git diff --exit-code -- public/local server/schema-text.js public/sw.js || {
            echo "::error::public/local/kernel.js or server/schema-text.js is out of date. Run 'npm run build:local' and commit the result."
            exit 1
          }
      - name: Package
        working-directory: src
        run: node scripts/package.js /tmp/suds.zip
      - name: Syntax-check browser modules
        working-directory: src
        run: for f in public/*.js public/views/*.js; do node --input-type=module --check < "$f" || exit 1; done
  # Everything with SUDS_THOROUGH=1 (scripts/test-thorough.js finds it by convention) except the SDC attacker
  # sweeps, which run in `thorough-sdc` below (npm test runs a sample of them): every test/*.test.js that reads
  # SUDS_THOROUGH (timing budgets), and the pure performance checks in test/thorough/, which npm test does
  # not run so that a busy runner cannot flake the required `test` job.
  thorough:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
      - name: Install Node 22 (pinned version, pinned checksum)
        run: |
          file="node-${NODE22_VERSION}-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://nodejs.org/dist/${NODE22_VERSION}/${file}"
          echo "${NODE22_SHA256}  ${file}" | sha256sum -c - || { echo "::error::${file} does not match the SHA-256 pinned in the workflow"; exit 1; }
          mkdir -p node22 && tar -xJf "$file" -C node22 --strip-components=1
          echo "$RUNNER_TEMP/node22/bin" >> "$GITHUB_PATH"
      - name: Node is the pinned release, of the major .nvmrc names
        working-directory: src
        run: |
          want="$(tr -d '[:space:]' < .nvmrc)"; have="$(node -p 'process.versions.node.split(".")[0]')"
          node --version; [ "$have" = "$want" ] || { echo "::error::Node $have is running but .nvmrc pins major $want"; exit 1; }
          [ "$(node --version)" = "$NODE22_VERSION" ] || { echo "::error::$(node --version) is running, not the pinned $NODE22_VERSION"; exit 1; }
      - name: Install
        working-directory: src
        run: npm ci --no-audit --no-fund
      - name: Thorough tests (performance checks, timing budgets; the SDC sweeps run in thorough-sdc)
        working-directory: src
        env:
          SUDS_THOROUGH: '1'
        run: node scripts/test-thorough.js --part rest
  # The statistical-disclosure-control attacker sweeps at full size (scripts/test-thorough.js SDC_SWEEPS: the
  # random-programme property test, the algorithm-aware attacker at thresholds 3 and 5, the refusal sweep, the
  # combined-funds families). At 1.15.3 they made the single thorough job take about 25 of its 30 minutes, so a
  # slower runner would have failed the release on a timeout, not a finding. Their own job, with room to spare;
  # required by the release gate like `thorough`.
  thorough-sdc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
      - name: Install Node 22 (pinned version, pinned checksum)
        run: |
          file="node-${NODE22_VERSION}-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://nodejs.org/dist/${NODE22_VERSION}/${file}"
          echo "${NODE22_SHA256}  ${file}" | sha256sum -c - || { echo "::error::${file} does not match the SHA-256 pinned in the workflow"; exit 1; }
          mkdir -p node22 && tar -xJf "$file" -C node22 --strip-components=1
          echo "$RUNNER_TEMP/node22/bin" >> "$GITHUB_PATH"
      - name: Node is the pinned release, of the major .nvmrc names
        working-directory: src
        run: |
          want="$(tr -d '[:space:]' < .nvmrc)"; have="$(node -p 'process.versions.node.split(".")[0]')"
          node --version; [ "$have" = "$want" ] || { echo "::error::Node $have is running but .nvmrc pins major $want"; exit 1; }
          [ "$(node --version)" = "$NODE22_VERSION" ] || { echo "::error::$(node --version) is running, not the pinned $NODE22_VERSION"; exit 1; }
      - name: Install
        working-directory: src
        run: npm ci --no-audit --no-fund
      - name: SDC attacker sweeps at full size
        working-directory: src
        env:
          SUDS_THOROUGH: '1'
        run: node scripts/test-thorough.js --part sdc
  browser:
    runs-on: ubuntu-latest
    # Measured on CI (1.17.0 candidate, runs 36612230830 and 36614997483): the whole job 27.9 min, the 51 scripts
    # 23 to 27 min, accessibility alone 595 to 634 s. 50 minutes is about 1.8 times that; a hang costs 50, not 75.
    timeout-minutes: 50
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
      - name: Install Node 22 (pinned version, pinned checksum)
        run: |
          file="node-${NODE22_VERSION}-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://nodejs.org/dist/${NODE22_VERSION}/${file}"
          echo "${NODE22_SHA256}  ${file}" | sha256sum -c - || { echo "::error::${file} does not match the SHA-256 pinned in the workflow"; exit 1; }
          mkdir -p node22 && tar -xJf "$file" -C node22 --strip-components=1
          echo "$RUNNER_TEMP/node22/bin" >> "$GITHUB_PATH"
      - name: Node is the pinned release, of the major .nvmrc names
        working-directory: src
        run: |
          want="$(tr -d '[:space:]' < .nvmrc)"; have="$(node -p 'process.versions.node.split(".")[0]')"
          node --version; [ "$have" = "$want" ] || { echo "::error::Node $have is running but .nvmrc pins major $want"; exit 1; }
          [ "$(node --version)" = "$NODE22_VERSION" ] || { echo "::error::$(node --version) is running, not the pinned $NODE22_VERSION"; exit 1; }
      # Playwright and axe-core (the accessibility script's engine) are test-only and never in package.json.
      # They go in ONE --no-save install: a second one prunes the package the first added.
      - name: Install Playwright and axe-core (test-only)
        working-directory: src
        run: npm ci --no-audit --no-fund && npm i --no-save --no-audit --no-fund playwright@1.56.1 axe-core@4.13.0 && npx playwright install --with-deps chromium
      - name: Browser regression suite
        working-directory: src
        # The suite's static build must not download 80 providers' pictures from the internet on every push;
        # static-site.mjs serves a fixture picture of its own instead (the Pages build fetches the real ones).
        env:
          SUDS_REGION_PICTURES: 'off'
        run: npm run build:local && scripts/ui/run-all.sh
  # Node 22 leaves maintenance in April 2027 and node:sqlite is still experimental, so the suite also runs on
  # the next LTS line (docs/DEPLOYMENT.md, "Node.js support and the move to 24"). Required (it passed on the
  # 1.11.0 release commit); the release gate (scripts/release-gate.js) refuses a commit where it
  # failed, so a Node 24 break is fixed before the move rather than discovered by it. There is no setup-node
  # action (marketplace actions are off), so the official tarball is downloaded and checked against a SHA-256
  # pinned HERE, not one read from the same server as the tarball. The version is exact, so no push is tested
  # on a different Node from the one before it without a commit saying so. To bump it (docs/RELEASE.md,
  # "Bumping the pinned Node versions"): take the version and the linux-x64 .tar.xz line of
  # https://nodejs.org/dist/v<version>/SHASUMS256.txt (after checking its signature, SHASUMS256.txt.asc) and
  # change both lines below in one commit. test/release-gate.test.js checks their shape.
  node24:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE24_VERSION: v24.21.0
      NODE24_SHA256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
      - name: Install Node 24 (pinned version, pinned checksum)
        run: |
          file="node-${NODE24_VERSION}-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://nodejs.org/dist/${NODE24_VERSION}/${file}"
          echo "${NODE24_SHA256}  ${file}" | sha256sum -c - || { echo "::error::${file} does not match the SHA-256 pinned in ci.yml"; exit 1; }
          mkdir -p node24 && tar -xJf "$file" -C node24 --strip-components=1
          echo "$RUNNER_TEMP/node24/bin" >> "$GITHUB_PATH"
      - name: Install
        working-directory: src
        run: node --version && npm ci --no-audit --no-fund
      - name: Test on Node 24
        working-directory: src
        run: npm test
  # Backup and restore, exercised on every push: seed a throwaway database, take an encrypted backup through
  # the scheduled-backup path, run the recovery drill with an escrowed key file (restore into a temporary
  # directory, separate process, schema/row counts/audit chain/anchors/decrypt/sign-in checks), restore again
  # with the host procedure into a fresh data directory and start the server on it, compare row counts and
  # verify the audit chain, and verify the signed drill report with the public key only
  # (scripts/dr-exercise.js; docs/security/BACKUP-AND-DR.md). Required by the release gate. The repository
  # uses no actions at all (not even actions/upload-artifact), so the signed report is printed into this log.
  dr-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
      - name: Install Node 22 (pinned version, pinned checksum)
        run: |
          file="node-${NODE22_VERSION}-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://nodejs.org/dist/${NODE22_VERSION}/${file}"
          echo "${NODE22_SHA256}  ${file}" | sha256sum -c - || { echo "::error::${file} does not match the SHA-256 pinned in the workflow"; exit 1; }
          mkdir -p node22 && tar -xJf "$file" -C node22 --strip-components=1
          echo "$RUNNER_TEMP/node22/bin" >> "$GITHUB_PATH"
      - name: Node is the pinned release, of the major .nvmrc names
        working-directory: src
        run: |
          want="$(tr -d '[:space:]' < .nvmrc)"; have="$(node -p 'process.versions.node.split(".")[0]')"
          node --version; [ "$have" = "$want" ] || { echo "::error::Node $have is running but .nvmrc pins major $want"; exit 1; }
          [ "$(node --version)" = "$NODE22_VERSION" ] || { echo "::error::$(node --version) is running, not the pinned $NODE22_VERSION"; exit 1; }
      - name: Backup, recovery drill and restore into a fresh data directory
        working-directory: src
        run: node --no-warnings=ExperimentalWarning scripts/dr-exercise.js --out "$RUNNER_TEMP/dr-evidence"
      - name: Drill summary
        if: always()
        run: |
          f="$RUNNER_TEMP/dr-evidence/summary.json"
          [ -f "$f" ] || exit 0
          { echo "### Recovery drill (development exercise, fictional data)"; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  # The browser suite drives Chromium; iPhones run WebKit. This smoke subset runs the two phone-shaped
  # scripts (the static build and the tester's retest, both on an iPhone 13 profile) in Playwright's WebKit.
  # Advisory while it beds in (continue-on-error). Playwright's WebKit on Linux is not iOS Safari, so the
  # real-device release checklist (docs/ADOPTION.md) still applies. Two service-worker cache checks that
  # Playwright's WebKit on Linux cannot reproduce (an upgraded persistent profile's shell cache; a page fetch
  # while offline) are reported as SKIP here, with their diagnostics, and checked on an iPhone instead
  # (scripts/ui/assert.mjs PLAYWRIGHT_WEBKIT_LINUX); every other check in the two scripts still counts.
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
      - name: Install Playwright WebKit (test-only)
        working-directory: src
        run: npm ci --no-audit --no-fund && npm i --no-save --no-audit --no-fund playwright@1.56.1 && npx playwright install --with-deps webkit
      - name: WebKit smoke subset
        working-directory: src
        env:
          SUDS_BROWSER: webkit
          SCRIPTS: static-site qa-retest
          SUDS_REGION_PICTURES: 'off'
        run: npm run build:local && scripts/ui/run-all.sh
  # What the release documents say (the questionnaire, the evidence index, RELEASE.md's supported versions and
  # ledger, the tag hand-off, HANDOFF.md's Release waiting entry, the CHANGELOG's dated sections) against the
  # CHANGELOG, main's history, origin's tags and the version.json gh-pages serves (scripts/release-state.js;
  # docs/RELEASE.md, stamp checklist). Advisory (continue-on-error), like webkit, and not in the release gate: its
  # answer changes when the owner pushes a tag or the site is republished, not only with the commit, and at a tag's
  # own release run the hand-off still, rightly, lists that tag as owed. A red run gets the documents fixed.
  # History without file contents (--filter=blob:none), as the release gate clones, so it can ask whether each
  # hand-off commit is on main; no npm install (Node built-ins and git only).
  release-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out, with main's and gh-pages' history (no file contents) and the release tags
        run: |
          git clone --quiet --filter=blob:none --no-checkout "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src
          cd src
          git fetch --quiet origin "${GITHUB_SHA}" '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/gh-pages:refs/remotes/origin/gh-pages' '+refs/tags/v*:refs/tags/v*'
          git checkout --quiet "${GITHUB_SHA}"
      - name: Install Node 22 (pinned version, pinned checksum)
        run: |
          file="node-${NODE22_VERSION}-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://nodejs.org/dist/${NODE22_VERSION}/${file}"
          echo "${NODE22_SHA256}  ${file}" | sha256sum -c - || { echo "::error::${file} does not match the SHA-256 pinned in the workflow"; exit 1; }
          mkdir -p node22 && tar -xJf "$file" -C node22 --strip-components=1
          echo "$RUNNER_TEMP/node22/bin" >> "$GITHUB_PATH"
      - name: Release documents against the tags, main and gh-pages
        working-directory: src
        run: node scripts/release-state.js
  # The release policy on every push (1.23.1; docs/RELEASE.md, "Stabilisation (from 1.23.1)"): until now it ran only
  # in release.yml's gate, against the previous tag, and 1.16.3 to 1.23.0 were never tagged, so nothing turned red
  # when a patch grew a migration or a minor came days after the last. scripts/release-policy-ci.js compares this
  # tree with the newest release: its tag, or, while the tags are owed, the commit docs/evidence/RELEASE-HANDOFF.md
  # records (release-policy.js --previous-ref). A patch that adds a migration, permission or route, or more than the
  # patch size limit, fails; so does a minor stamped within 28 days of the previous feature release, unless its
  # CHANGELOG section or Record names a security exception. Not advisory: a red job fails the run, so the release
  # gate refuses the commit. One commit deep plus the tags (each one deep); the script fetches the hand-off commit
  # it compares with by its SHA (--fetch). No npm install: Node built-ins and git only, as in the gate.
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out, with the release tags
        run: |
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
          git fetch --quiet --depth 1 origin '+refs/tags/v*:refs/tags/v*'
      - name: Install Node 22 (pinned version, pinned checksum)
        run: |
          file="node-${NODE22_VERSION}-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://nodejs.org/dist/${NODE22_VERSION}/${file}"
          echo "${NODE22_SHA256}  ${file}" | sha256sum -c - || { echo "::error::${file} does not match the SHA-256 pinned in the workflow"; exit 1; }
          mkdir -p node22 && tar -xJf "$file" -C node22 --strip-components=1
          echo "$RUNNER_TEMP/node22/bin" >> "$GITHUB_PATH"
      - name: Release policy against the newest release (tag or hand-off commit)
        working-directory: src
        run: node scripts/release-policy-ci.js --fetch
  # Windows (1.24): the path a tester takes on a Windows 11 PC (docs/TRY-ON-WINDOWS.md), on windows-latest with the
  # pinned Node 22. The checkout goes through Git for Windows (core.autocrlf), so .gitattributes is tested too. No
  # npm install, because the doc tells a tester none is needed. `npm run try` is started on a free port in a temporary
  # data folder, signs in with a sample account, lists clients and is stopped the way Ctrl+C does
  # (test/try-local.test.js). Then the OS-sensitive part of npm test runs: config and keys, crypto, backups, the audit
  # chain and its anchors, the instance lock, logs, migrations, health. Not in the release gate's required list, and
  # not advisory: a red job fails the run, as release-policy does. The same smoke test runs on Linux in npm test.
  # NODE22_WIN_SHA256 is the win-x64.zip line of the same SHASUMS256.txt as NODE22_SHA256: bump both together.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NODE22_WIN_SHA256: 2b0ff57b049cda1bbcea2240eec20467018713c1efe1f7360c2681859b90ed71
    steps:
      - name: Check out
        shell: bash
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
      - name: Install Node 22 (pinned version, pinned checksum)
        shell: pwsh
        run: |
          $file = "node-$env:NODE22_VERSION-win-x64.zip"
          Set-Location $env:RUNNER_TEMP
          curl.exe -fsSLO "https://nodejs.org/dist/$env:NODE22_VERSION/$file"
          $have = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($have -ne $env:NODE22_WIN_SHA256) { Write-Output "::error::$file does not match the SHA-256 pinned in the workflow"; exit 1 }
          Expand-Archive $file -DestinationPath node22
          Join-Path $env:RUNNER_TEMP "node22\node-$env:NODE22_VERSION-win-x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Node is the pinned release, of the major .nvmrc names
        shell: pwsh
        working-directory: src
        run: |
          $want = (Get-Content .nvmrc -Raw).Trim(); $have = node -p "process.versions.node.split('.')[0]"
          node --version
          if ($have -ne $want) { Write-Output "::error::Node $have is running but .nvmrc pins major $want"; exit 1 }
          if ((node --version) -ne $env:NODE22_VERSION) { Write-Output "::error::$(node --version) is running, not the pinned $env:NODE22_VERSION"; exit 1 }
      - name: npm run try starts through npm's Windows script shell
        shell: pwsh
        working-directory: src
        run: npm run try -- --help
      - name: npm run try, signed in, and stopped as Ctrl+C stops it
        shell: pwsh
        working-directory: src
        run: node --no-warnings=ExperimentalWarning --test test/try-local.test.js
      - name: The OS-sensitive tests (config, keys, crypto, backups, audit, lock, logs, migrations)
        shell: pwsh
        working-directory: src
        run: node --no-warnings=ExperimentalWarning --test test/crypto.test.js test/key-separation.test.js test/secret-files.test.js test/backup.test.js test/backup-restore-in-place.test.js test/scheduled-backup.test.js test/audit-anchor-interval.test.js test/audit-head-at-start.test.js test/audit-immutable.test.js test/audit-retention.test.js test/instance-lock.test.js test/log.test.js test/migrations.test.js test/health-probes.test.js test/rotate-index-key.test.js test/update.test.js
