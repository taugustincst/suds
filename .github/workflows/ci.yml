name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test
      - name: Syntax-check browser modules
        run: for f in public/*.js public/views/*.js; do node --input-type=module --check < "$f" || exit 1; done
