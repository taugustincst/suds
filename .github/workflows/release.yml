name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test
      - name: Check tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Package
        run: node scripts/package.js "suds-${GITHUB_REF_NAME}.zip"
      - name: Publish GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = index($0, v) > 0} p' CHANGELOG.md)
          gh release create "${GITHUB_REF_NAME}" "suds-${GITHUB_REF_NAME}.zip" --title "SUDS ${GITHUB_REF_NAME}" --notes "${notes:-See CHANGELOG.md}"
