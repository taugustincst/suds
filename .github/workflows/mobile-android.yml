name: Android app
# Uses no marketplace actions: the hosted Ubuntu image already provides git, JDK 17, the Android SDK, Gradle and gh.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: "Also attach the APK to the GitHub Release for the version in package.json (creates the release/tag if missing)"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        run: git clone --depth 1 --branch "${GITHUB_REF_NAME}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" src
      - name: Build local kernel (web app bundled into the APK)
        working-directory: src
        run: npm ci --no-audit --no-fund && npm run build:local
      - name: Build APK
        working-directory: src/mobile/android
        env:
          SUDS_KEYSTORE_BASE64: ${{ secrets.SUDS_KEYSTORE_BASE64 }}
          SUDS_KEYSTORE_PASSWORD: ${{ secrets.SUDS_KEYSTORE_PASSWORD }}
          SUDS_KEY_ALIAS: ${{ secrets.SUDS_KEY_ALIAS }}
          SUDS_KEY_PASSWORD: ${{ secrets.SUDS_KEY_PASSWORD }}
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          # The runner's Gradle is whatever its image ships. Warn loudly if it is not the version the
          # project pins, so a build that differs from a developer's is visible rather than mysterious.
          pinned=$(sed -n 's/.*gradle-\([0-9.]*\)-bin.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties)
          actual=$(gradle --version 2>/dev/null | sed -n 's/^Gradle *//p' | head -1)
          echo "Gradle pinned=${pinned:-unknown} runner=${actual:-unknown}"
          [ "${pinned%%.*}" = "${actual%%.*}" ] || echo "::warning::Runner Gradle ${actual} differs from the pinned ${pinned}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          if [ -n "$SUDS_KEYSTORE_BASE64" ]; then
            echo "$SUDS_KEYSTORE_BASE64" | base64 -d > /tmp/suds.jks
            export SUDS_KEYSTORE=/tmp/suds.jks
            gradle --no-daemon --console=plain assembleRelease
            cp app/build/outputs/apk/release/app-release*.apk "$GITHUB_WORKSPACE/SUDS-android.apk"
            echo "SUDS_APK_SIGNED=1" >> "$GITHUB_ENV"
          else
            # No signing key configured. A release APK signed with the runner's throwaway debug key gets a
            # different signature every build, so Android refuses to install it over the previous version
            # and staff would have to uninstall — losing the data on the device. Build a clearly-labelled
            # debug APK instead, and do not publish it as a release.
            echo "::warning::SUDS_KEYSTORE_BASE64 is not set; building an unsigned debug APK. It will not be published."
            gradle --no-daemon --console=plain assembleDebug
            cp app/build/outputs/apk/debug/app-debug*.apk "$GITHUB_WORKSPACE/SUDS-android-debug.apk"
            echo "SUDS_APK_SIGNED=0" >> "$GITHUB_ENV"
          fi
          ls -la "$GITHUB_WORKSPACE"/SUDS-android*.apk
      - name: Publish to GitHub Release
        if: (github.event_name == 'push' || inputs.publish) && env.SUDS_APK_SIGNED == '1'
        run: |
          cd src
          tag="${GITHUB_REF_NAME}"; case "$tag" in v*) ;; *) tag="v$(node -p "require('./package.json').version")";; esac
          if ! gh release view "$tag" >/dev/null 2>&1; then
            notes=$(awk -v v="${tag#v}" '/^## /{p = index($0, v) > 0} p' CHANGELOG.md)
            gh release create "$tag" --target "$(git rev-parse HEAD)" --title "SUDS $tag" --notes "${notes:-See CHANGELOG.md}"
          fi
          gh release upload "$tag" "$GITHUB_WORKSPACE/SUDS-android.apk" --clobber
          echo "APK attached to release $tag: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag"
