name: Release
# Uses no marketplace actions. Refuses to release a commit whose CI did not pass (the `gate` job). Releases a v* tag
# only (1.16.3): the owner pushes the tag at the version-stamp commit on main once its CI is green, and that push
# starts this workflow; *Run workflow* runs it again on an existing v* tag (a retry, or with policy_exception), and
# is refused on a branch. The workflow never creates a tag, so the `v*` tag ruleset (only the owner makes release
# tags) and the `release` environment's `v*`-only deployment rule both hold (docs/RELEASE.md, "Cutting a release"
# and "Owner: repository settings"). It creates the GitHub Release with the source zip, then asks web-app.yml to
# publish the web app for that tag. The native apps and desktop launchers were removed in 1.9.3
# (docs/PLATFORM.md). Since the owner decision of 2026-10-03 (docs/PLATFORM.md, docs/WINDOWS-SERVER.md) the release also
# carries the Windows server zip, suds-<version>-windows-x64.zip and its .sha256, built by the windows-exe and
# windows-sign jobs; nothing else is built or attached.
#
# Three jobs since 1.16.4 (engineering review of 1.16.3, M5 and H1), and two for the Windows zip since 1.24. `gate` checks CI, the release policy and any
# GitHub Release already made for the tag, with a read-only token. `verify` runs npm ci, the tests and the kernel
# drift check, with a read-only token and no environment. `release` waits for the owner's approval in the
# `release` environment and is the only job with a write token: it runs no npm and none of the released commit's
# code; it builds the zip with `git archive`, checks any existing GitHub Release against it byte for byte (main's
# scripts/release-existing.js), and publishes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      confirm:
        description: "Choose an existing v* tag under 'Use workflow from', then type 'release' to release it (a branch is refused)"
        required: true
        default: ''
      # The release policy (docs/RELEASE.md, "Release cadence"): a patch release carries no migration, no new
      # permission and no new route, and a feature (minor or major) release comes at most once every 28 days.
      # scripts/release-policy.js refuses a release that breaks either, unless policy_exception is set to the
      # reason, which is then printed at the top of the release notes. Leave empty for no exception.
      policy_exception:
        description: "Only to release against the release policy (a PATCH release adding a migration, permission or route, or a feature release within 28 days of the last): the reason (printed at the top of the release notes)"
        required: false
        default: ''
      # The same, under its name before 1.14.0 (patch releases only then); kept so a saved dispatch still works.
      allow_patch_changes:
        description: "Earlier name of policy_exception (the same effect)"
        required: false
        default: ''
# The Node 22 the release is tested and packaged on: the release ci.yml pins, with the same checksum.
env:
  NODE22_VERSION: v22.23.3
  NODE22_SHA256: df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de
# Read-only unless a job asks for more; only the `release` job does.
permissions:
  contents: read
jobs:
  # The release gate. Nothing is built or published unless CI (ci.yml) concluded success for this exact
  # commit, with the test, browser (the whole browser suite: accessibility, a11y-round4 and the rest), node24
  # and dr-drill jobs all green (scripts/release-gate.js; docs/RELEASE.md, "Release gate"). It waits for CI
  # still running on the commit, up to an hour. WebKit stays advisory.
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.confirm == 'release'
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    # The main commit whose gate scripts ran, for the release job's notes (1.16.2: it read origin/main again at
    # publish time, which may have moved during the approval).
    outputs:
      main_sha: ${{ steps.src.outputs.main_sha }}
      # The policy exception's paragraph for the top of the release notes (1.16.4: written here, by main's policy
      # script, so the release job runs none of the released commit's code).
      policy_notes: ${{ steps.policy.outputs.policy_notes }}
      # "true" on the newest release line; "false" for a maintenance release of an older minor (1.17.0), which the
      # release job neither marks Latest nor publishes to the web app.
      latest: ${{ steps.policy.outputs.latest }}
    steps:
      # 1.16.3: a release is always of a v* tag. Until then *Run workflow* on a release/v* branch created the tag
      # itself, which the owner's settings (the `release` environment limited to v* tags, the v* tag ruleset) refuse
      # after the approval; now the one path is the tag, and a branch is refused here, before anything waits.
      - name: Release a v* tag only (a pushed tag, or Run workflow on an existing one)
        run: |
          case "${GITHUB_REF}" in refs/tags/v*) ;; *) echo "::error::Releases are made from a v* tag, not ${GITHUB_REF}: push the tag at the version-stamp commit on main (docs/RELEASE.md, Cutting a release), or choose an existing v* tag in Run workflow"; exit 1;; esac
      # The gate's own scripts are main's copy, not the released commit's (1.16.1): a commit that trims
      # REQUIRED_JOBS or lifts a policy limit, with the tests that pin them, could otherwise release itself.
      # History without file contents (--filter=blob:none), so the policy can ask whether the commit is on main.
      # What this does and does not guarantee: docs/RELEASE.md, "What running main's copy guarantees".
      - name: Check out the commit being released, and main's copy of the gate scripts
        id: src
        run: |
          git clone --quiet --filter=blob:none --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" src
          cd src
          # The maintenance branches too (1.17.0): a patch of an older minor may be on maint/X.Y instead of main.
          git fetch --quiet origin "${GITHUB_SHA}" '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/maint/*:refs/remotes/origin/maint/*' '+refs/tags/v*:refs/tags/v*'
          git checkout --quiet "${GITHUB_SHA}"
          mkdir -p "$RUNNER_TEMP/main"
          main_sha="$(git rev-parse origin/main)"; echo "main_sha=${main_sha}" >> "$GITHUB_OUTPUT"
          git archive "${main_sha}" scripts/release-gate.js scripts/release-policy.js scripts/release-existing.js | tar -x -C "$RUNNER_TEMP/main"
      - name: CI passed for this exact commit
        run: node "$RUNNER_TEMP/main/scripts/release-gate.js" "${GITHUB_SHA}"
      # A patch bump may not add a migration, permission or route, and a minor or major bump may not come within
      # 28 days of the previous feature release (scripts/release-policy.js compares with the previous release
      # tags and their dates). Whatever the exception, the commit must be on main, and a version already tagged
      # at another commit is refused (--sha, --main). The exception arrives through the environment, never
      # pasted into the script.
      - name: Release policy (patch releases add no migration, permission or route, device routes included, and at most 1,500 lines; feature releases at most every 28 days; the commit is on main and its version not released at another commit)
        id: policy
        env:
          RELEASE_POLICY_EXCEPTION: ${{ github.event.inputs.policy_exception }}
          ALLOW_PATCH_CHANGES: ${{ github.event.inputs.allow_patch_changes }}
          # The tag must name package.json's version (1.16.2 for a pushed tag; since 1.16.3 every run is on a tag).
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node "$RUNNER_TEMP/main/scripts/release-policy.js" --root src --sha "${GITHUB_SHA}" --main origin/main --maint origin/maint --tag "$RELEASE_TAG" --notes-out "$RUNNER_TEMP/policy-notes.md" --latest-out "$RUNNER_TEMP/latest"
          latest="$(cat "$RUNNER_TEMP/latest")"
          case "$latest" in true|false) echo "latest=${latest}" >> "$GITHUB_OUTPUT" ;; *) echo "::error::The release policy did not say whether this is the newest release line"; exit 1 ;; esac
          if [ "$latest" = false ]; then echo "### A maintenance release of an older minor: it will not be marked Latest, and the web app is not published from it" >> "$GITHUB_STEP_SUMMARY"; fi
          d="NOTES_$(openssl rand -hex 16)"
          { echo "policy_notes<<${d}"; cat "$RUNNER_TEMP/policy-notes.md"; echo; echo "${d}"; } >> "$GITHUB_OUTPUT"
      # A GitHub Release someone else made for the tag stops the release here, before the owner is asked to approve
      # it (engineering review of 1.16.3, H1; docs/RELEASE.md, "A GitHub Release made by someone else"). The zip is
      # built exactly as the release job builds it. This read-only token does not see a draft; the release job,
      # with its write token, checks again.
      - name: Any GitHub Release for this tag is this workflow's, with the files built from the tag
        working-directory: src
        run: |
          ver="${GITHUB_REF_NAME}"
          mkdir -p "$RUNNER_TEMP/pkg"
          git archive --format=zip --prefix="suds-$ver/" -o "$RUNNER_TEMP/pkg/suds-$ver.zip" "${GITHUB_SHA}"
          (cd "$RUNNER_TEMP/pkg" && sha256sum "suds-$ver.zip" > "suds-$ver.zip.sha256")
          node "$RUNNER_TEMP/main/scripts/release-existing.js" --tag "$ver" --dir "$RUNNER_TEMP/pkg" --repo "${GITHUB_REPOSITORY}"
  # npm and the tests run here, before the approval, with a read-only token, no environment and no secret (1.16.4;
  # engineering review of 1.16.3, M5: they ran in the release job, where a dependency could reach the packaging
  # step through $GITHUB_ENV, $GITHUB_PATH or a replaced git, sha256sum or gh, with a write token). Nothing this
  # job makes is used by another: the release job builds the zip itself.
  verify:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The gate checked GITHUB_SHA. A tag that moved since would test a commit CI never passed, so test exactly
      # the gated commit or nothing. The token is dropped from the remote once it has fetched.
      - name: Check out exactly the commit the gate checked
        run: |
          git clone --quiet --branch "${GITHUB_REF_NAME}" "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src
          cd src && git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git checkout --quiet "${GITHUB_SHA}" || { echo "::error::${GITHUB_SHA} is not on ${GITHUB_REF_NAME}"; exit 1; }
          [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ] || { echo "::error::Checked out $(git rev-parse HEAD), gated ${GITHUB_SHA}"; exit 1; }
      # These were one `&&`/`||` chain. Both operators bind at the same precedence and associate left, so a
      # failing `npm test` fell through to the `echo` and the step exited 0 — releases were published with
      # failing tests. They are separate steps now, and a stale kernel fails rather than warns.
      - name: Install Node 22 (pinned version, pinned checksum)
        run: |
          file="node-${NODE22_VERSION}-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://nodejs.org/dist/${NODE22_VERSION}/${file}"
          echo "${NODE22_SHA256}  ${file}" | sha256sum -c - || { echo "::error::${file} does not match the SHA-256 pinned in the workflow"; exit 1; }
          mkdir -p node22 && tar -xJf "$file" -C node22 --strip-components=1
          echo "$RUNNER_TEMP/node22/bin" >> "$GITHUB_PATH"
      - name: Node is the pinned release, of the major .nvmrc names
        working-directory: src
        run: |
          want="$(tr -d '[:space:]' < .nvmrc)"; have="$(node -p 'process.versions.node.split(".")[0]')"
          node --version; [ "$have" = "$want" ] || { echo "::error::Node $have is running but .nvmrc pins major $want"; exit 1; }
          [ "$(node --version)" = "$NODE22_VERSION" ] || { echo "::error::$(node --version) is running, not the pinned $NODE22_VERSION"; exit 1; }
      - name: Install
        working-directory: src
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: src
        run: npm test
      - name: Verify the committed local kernel matches its sources
        working-directory: src
        run: |
          npm run build:local
          git diff --exit-code -- public/local server/schema-text.js public/sw.js || {
            echo "::error::The committed kernel is stale; the release zip would ship it. Run 'npm run build:local' and commit."
            exit 1
          }
  # The Windows server zip, from the gated commit (docs/RELEASE.md, "The Windows server zip"): scripts/build-windows.js
  # on windows-latest with the pins ci.yml's windows-exe job holds (the same values here; test/workflow-yaml.test.js
  # checks they agree), a read-only token and no secret. It stages the files and does not zip them: signing comes
  # next, in a job that runs no npm package and no third-party code (postject runs here).
  windows-exe:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NODE22_WIN_SHA256: 2b0ff57b049cda1bbcea2240eec20467018713c1efe1f7360c2681859b90ed71
      WINSW_VERSION: v2.12.0
      WINSW_SHA256: 05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da
      POSTJECT_VERSION: 1.0.0-alpha.6
      POSTJECT_INTEGRITY: sha512-b9Eb8h2eVqNE8edvKdwqkrY6O7kAwmI8kcnBv1NScolYJbo59XUF0noFq+lxbC1yN20bmC0WBEbDC5H/7ASb0A==
    steps:
      - name: Check out exactly the commit the gate checked
        shell: bash
        run: |
          git clone --quiet --no-checkout --branch "${GITHUB_REF_NAME}" "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src
          cd src && git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git checkout --quiet "${GITHUB_SHA}" || { echo "::error::${GITHUB_SHA} is not on ${GITHUB_REF_NAME}"; exit 1; }
          [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ] || { echo "::error::Checked out $(git rev-parse HEAD), gated ${GITHUB_SHA}"; exit 1; }
      - name: Install Node 22 (pinned version, pinned checksum)
        shell: pwsh
        run: |
          $file = "node-$env:NODE22_VERSION-win-x64.zip"
          Set-Location $env:RUNNER_TEMP
          curl.exe -fsSLO "https://nodejs.org/dist/$env:NODE22_VERSION/$file"
          $have = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($have -ne $env:NODE22_WIN_SHA256) { Write-Output "::error::$file does not match the SHA-256 pinned in the workflow"; exit 1 }
          Expand-Archive $file -DestinationPath node22
          Join-Path $env:RUNNER_TEMP "node22\node-$env:NODE22_VERSION-win-x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Download WinSW and postject (pinned checksums)
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          curl.exe -fsSL -o WinSW-x64.exe "https://github.com/winsw/winsw/releases/download/$env:WINSW_VERSION/WinSW-x64.exe"
          $have = (Get-FileHash WinSW-x64.exe -Algorithm SHA256).Hash.ToLower()
          if ($have -ne $env:WINSW_SHA256) { Write-Output "::error::WinSW-x64.exe $env:WINSW_VERSION does not match the SHA-256 pinned in the workflow"; exit 1 }
          curl.exe -fsSLO "https://registry.npmjs.org/postject/-/postject-$env:POSTJECT_VERSION.tgz"
      - name: Build and stage the Windows server (not zipped yet)
        shell: pwsh
        working-directory: src
        run: |
          if ((node --version) -ne $env:NODE22_VERSION) { Write-Output "::error::$(node --version) is running, not the pinned $env:NODE22_VERSION"; exit 1 }
          node scripts/build-windows.js --node-zip "$env:RUNNER_TEMP\node-$env:NODE22_VERSION-win-x64.zip" --winsw "$env:RUNNER_TEMP\WinSW-x64.exe" --postject "$env:RUNNER_TEMP\postject-$env:POSTJECT_VERSION.tgz" --stage "$env:RUNNER_TEMP\stage" --no-zip
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::scripts/build-windows.js failed"; exit 1 }
      - name: Hand the staged files to the signing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-stage
          path: ${{ runner.temp }}/stage
          if-no-files-found: error
          retention-days: 1
  # Authenticode signing of suds.exe and suds-service.exe, when the repository has the WINDOWS_CERT_PFX_BASE64 and
  # WINDOWS_CERT_PASSWORD secrets (docs/RELEASE.md, "Signing the Windows server"); otherwise the zip is published
  # unsigned and a notice says so. The secrets reach the signing step only; that step runs signtool from the runner's
  # Windows SDK and nothing from the repository or npm. Then the staged folder is zipped (scripts/build-windows.js
  # --pack: Node built-ins only) and handed to the release job.
  windows-sign:
    needs: windows-exe
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NODE22_WIN_SHA256: 2b0ff57b049cda1bbcea2240eec20467018713c1efe1f7360c2681859b90ed71
    steps:
      - name: Check out exactly the commit the gate checked
        shell: bash
        run: |
          git clone --quiet --no-checkout --branch "${GITHUB_REF_NAME}" "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src
          cd src && git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git checkout --quiet "${GITHUB_SHA}" || { echo "::error::${GITHUB_SHA} is not on ${GITHUB_REF_NAME}"; exit 1; }
      - name: Install Node 22 (pinned version, pinned checksum)
        shell: pwsh
        run: |
          $file = "node-$env:NODE22_VERSION-win-x64.zip"
          Set-Location $env:RUNNER_TEMP
          curl.exe -fsSLO "https://nodejs.org/dist/$env:NODE22_VERSION/$file"
          $have = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($have -ne $env:NODE22_WIN_SHA256) { Write-Output "::error::$file does not match the SHA-256 pinned in the workflow"; exit 1 }
          Expand-Archive $file -DestinationPath node22
          Join-Path $env:RUNNER_TEMP "node22\node-$env:NODE22_VERSION-win-x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Fetch the staged files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-stage
          path: ${{ runner.temp }}/stage
      - name: Sign suds.exe and suds-service.exe (when the certificate secrets exist)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          $exes = @((Join-Path $stage 'suds.exe'), (Join-Path $stage 'suds-service.exe'))
          if (-not $env:WINDOWS_CERT_PFX_BASE64 -or -not $env:WINDOWS_CERT_PASSWORD) {
            Write-Output "::notice::No code-signing certificate (secrets WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD): the Windows server zip is published UNSIGNED, and Windows SmartScreen will warn county IT. docs/RELEASE.md, Signing the Windows server, says how to add one."
            exit 0
          }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Output "::error::signtool.exe was not found in the Windows SDK on the runner"; exit 1 }
          $pfx = Join-Path $env:RUNNER_TEMP 'suds-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 /d SUDS @exes
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::signtool sign failed"; exit 1 }
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
          & $signtool.FullName verify /pa /all @exes
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::the signatures do not verify"; exit 1 }
          Write-Output "Signed (and timestamped): suds.exe, suds-service.exe"
      - name: Zip it (suds-<version>-windows-x64.zip and its .sha256)
        shell: pwsh
        working-directory: src
        run: |
          node scripts/build-windows.js --pack "$env:RUNNER_TEMP\stage" --out "$env:RUNNER_TEMP\win"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::packing the Windows zip failed"; exit 1 }
          Get-ChildItem "$env:RUNNER_TEMP\win" | Format-Table -AutoSize Name, Length | Out-String | Write-Output
      - name: Hand the zip to the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suds-windows-x64
          path: ${{ runner.temp }}/win
          if-no-files-found: error
          retention-days: 7
  # The `release` environment: once the owner adds a required reviewer to it (GitHub -> Settings ->
  # Environments -> release; docs/RELEASE.md, "Owner control over releases"), this job waits for that person's
  # approval after the gate and the tests, before anything is packaged or published, however the workflow was
  # started. Without the setting the environment is created on first use and does not wait. It is the only job
  # with a write token, and it runs no npm and none of the released commit's code: git, sha256sum, jq, gh, and
  # main's scripts/release-existing.js (from the gate's main commit) on the runner's own Node.
  release:
    needs: [gate, verify, windows-sign]
    runs-on: ubuntu-latest
    environment: release
    if: github.event_name == 'push' || github.event.inputs.confirm == 'release'
    permissions:
      contents: write
      # `gh workflow run web-app.yml` below: a release this workflow creates with GITHUB_TOKEN does not fire the
      # `release` event for other workflows, so the web app publish is started explicitly.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      # gh runs outside the clone below (in the folder holding the zip), so it is told the repository.
      GH_REPO: ${{ github.repository }}
      # Who started the release, recorded in the release notes. Through the environment, never pasted into a script.
      RELEASE_ACTOR: ${{ github.actor }}
      RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      MAIN_SHA: ${{ needs.gate.outputs.main_sha }}
      # "false" for a maintenance release of an older minor (the gate's policy step decided; docs/RELEASE.md, "Backports").
      LATEST: ${{ needs.gate.outputs.latest }}
    steps:
      - name: Check out
        run: git clone --quiet --branch "${GITHUB_REF_NAME}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" src
      - name: Release exactly the commit the gate checked
        working-directory: src
        run: |
          git checkout --quiet "${GITHUB_SHA}" || { echo "::error::${GITHUB_SHA} is not on ${GITHUB_REF_NAME}"; exit 1; }
          [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ] || { echo "::error::Checked out $(git rev-parse HEAD), gated ${GITHUB_SHA}"; exit 1; }
      # The zip is `git archive` of the tag (what scripts/package.js does, without running it): the same bytes the
      # gate built and compared, and the same on a re-run.
      - name: Package
        working-directory: src
        run: |
          ver="v$(jq -r .version package.json)"
          if [ "${GITHUB_REF_NAME}" != "$ver" ]; then echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json $ver"; exit 1; fi
          # A version already tagged at another commit is never released again (the gate refused it too).
          git fetch --quiet --depth 1 origin '+refs/tags/v*:refs/tags/v*' || true
          at="$(git rev-parse -q --verify "refs/tags/$ver^{commit}" || true)"
          if [ -n "$at" ] && [ "$at" != "$(git rev-parse HEAD)" ]; then echo "::error::$ver is already tagged at $at, not this commit"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/pkg"
          git archive --format=zip --prefix="suds-$ver/" -o "$RUNNER_TEMP/pkg/suds-$ver.zip" "${GITHUB_SHA}"
          # A checksum beside the zip: docs/DEPLOYMENT.md tells an installer to compare it before unpacking.
          (cd "$RUNNER_TEMP/pkg" && sha256sum "suds-$ver.zip" > "suds-$ver.zip.sha256")
          # main's copy of the check, from the very commit the gate ran (not main's tip now).
          git fetch --quiet origin "${MAIN_SHA}"
          git show "${MAIN_SHA}:scripts/release-existing.js" > "$RUNNER_TEMP/release-existing.js"
      # The Windows server zip the windows-sign job made (data only: two files, checked against the checksum it carries,
      # with the name this tag's version gives). It joins the source zip in pkg/, so the checks below cover it too.
      - name: Fetch the Windows server zip
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: suds-windows-x64
          path: ${{ runner.temp }}/win
      - name: The Windows server zip is the two files expected, matching its checksum
        run: |
          ver="${GITHUB_REF_NAME#v}"; z="suds-${ver}-windows-x64.zip"
          cd "$RUNNER_TEMP/win"
          [ "$(ls -A | sort | tr '\n' ' ')" = "${z} ${z}.sha256 " ] || { echo "::error::The Windows artifact holds $(ls -A | tr '\n' ' '), not ${z} and ${z}.sha256"; exit 1; }
          [ -f "$z" ] && [ ! -L "$z" ] && [ -f "$z.sha256" ] && [ ! -L "$z.sha256" ] || { echo "::error::The Windows artifact's files are not plain files"; exit 1; }
          sha256sum -c "$z.sha256" || { echo "::error::${z} does not match its checksum"; exit 1; }
          cp "$z" "$z.sha256" "$RUNNER_TEMP/pkg/"
      # Again after the approval, which may have come much later, and with this job's token, which sees drafts.
      - name: Any GitHub Release for this tag is this workflow's, with the files built from the tag
        id: existing
        run: node "$RUNNER_TEMP/release-existing.js" --tag "${GITHUB_REF_NAME}" --dir "$RUNNER_TEMP/pkg" --repo "${GITHUB_REPOSITORY}"
      - name: Publish
        working-directory: src
        env:
          ACTION: ${{ steps.existing.outputs.action }}
          PUBLISH_DRAFT: ${{ steps.existing.outputs.publish_draft }}
          # The files the release does not carry yet (the check names them): the source zip pair and the Windows pair.
          MISSING: ${{ steps.existing.outputs.missing }}
          POLICY_NOTES: ${{ needs.gate.outputs.policy_notes }}
        run: |
          ver="${GITHUB_REF_NAME}"
          notes=$(awk -v v="${ver#v}" '/^## /{p = index($0, v) > 0} p' CHANGELOG.md)
          # A policy exception (checked in the gate, which wrote this paragraph) is stated at the top of the notes.
          if [ -n "$(printf '%s' "${POLICY_NOTES}" | tr -d '[:space:]')" ]; then notes="${POLICY_NOTES}"$'\n\n'"${notes}"; fi
          # Who released it: the account that pushed the tag or dispatched the workflow (and, on a re-run, who re-ran it).
          by="Released by @${RELEASE_ACTOR} (${GITHUB_EVENT_NAME}, run ${GITHUB_RUN_ID})"
          if [ -n "${RELEASE_TRIGGERING_ACTOR}" ] && [ "${RELEASE_TRIGGERING_ACTOR}" != "${RELEASE_ACTOR}" ]; then by="${by}, re-run by @${RELEASE_TRIGGERING_ACTOR}"; fi
          notes="${notes:-See CHANGELOG.md}"$'\n\n'"---"$'\n'"${by}."
          cd "$RUNNER_TEMP/pkg"
          # A published file is never replaced (until 1.16.1 a re-run uploaded over them): the check above said what
          # is missing, and refused a release that is not this workflow's or whose files are not the tag's.
          # A maintenance release (1.16.5 after 1.17.0) is never marked the repository's Latest release: GitHub would
          # otherwise mark the newest-made release Latest, and "latest" downloads would go back to the older minor.
          case "${LATEST}" in true) latest_flag="--latest" ;; false) latest_flag="--latest=false" ;; *) echo "::error::The gate did not say whether this is the newest release line"; exit 1 ;; esac
          case "${ACTION}" in
            create)
              # --verify-tag: the tag exists already (the owner pushed it); this workflow never creates one.
              # Every file at once: an immutable release takes no file after it is published.
              gh release create "$ver" "suds-$ver.zip" "suds-$ver.zip.sha256" "suds-${ver#v}-windows-x64.zip" "suds-${ver#v}-windows-x64.zip.sha256" --verify-tag "$latest_flag" --title "SUDS $ver" --notes "${notes:-See CHANGELOG.md}" ;;
            # Only what is missing (a published file is never replaced). MISSING holds plain file names, no spaces.
            upload) gh release upload "$ver" ${MISSING} ;;
            none) echo "The release $ver already has its zips and checksums, the ones built from the tag; nothing is replaced." ;;
            *) echo "::error::Unknown action '${ACTION}'"; exit 1 ;;
          esac
          # A draft this workflow left behind (a create interrupted before it published) is published now that its
          # files are checked (engineering review of 1.16.3, L1); a draft anyone else made was refused above.
          if [ "${PUBLISH_DRAFT}" = "true" ]; then gh release edit "$ver" --draft=false "$latest_flag"; fi
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/$ver"
      - name: What is published is this workflow's release, with the files built from the tag
        run: node "$RUNNER_TEMP/release-existing.js" --tag "${GITHUB_REF_NAME}" --dir "$RUNNER_TEMP/pkg" --repo "${GITHUB_REPOSITORY}" --after-publish
      # Only after the tests passed and the release exists. A release (or tag) this workflow creates with
      # GITHUB_TOKEN starts no other workflow, so the web app publish is asked for explicitly: this dispatch, on
      # the release tag, is the only way web-app.yml runs besides a person republishing a released tag (since
      # 1.16.1 a tag push no longer starts it), and it checks the GitHub Release exists at the tag's commit.
      # Not for a maintenance release (1.17.0): the public web app stays on the newest minor.
      - name: Publish the web app for this release
        run: |
          if [ "${LATEST}" != true ]; then
            echo "${GITHUB_REF_NAME} is a maintenance release of an older minor: the web app stays on the newest release." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run web-app.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}"
          echo "Started the web app publish for ${GITHUB_REF_NAME}. QA: open it and check the on-screen version reads ${GITHUB_REF_NAME#v}."
      - name: Release QA reminder
        run: |
          echo "### Release QA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Check the on-screen version (footer / version.json) on the web app and on a pilot server after deploy." >> "$GITHUB_STEP_SUMMARY"
          echo "- Run the real-device checklist in docs/ADOPTION.md (2 iPhones, 2 Androids) before the wider rollout." >> "$GITHUB_STEP_SUMMARY"
