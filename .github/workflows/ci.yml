name: CI
# Uses no marketplace actions so it runs under a restrictive Actions policy.
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
      # No setup-node action (marketplace actions are off); the runner's own Node is used, so make sure it
      # is the major .nvmrc, the Dockerfile and package.json's engines field all agree on.
      - name: Node major matches .nvmrc
        working-directory: src
        run: |
          want="$(tr -d '[:space:]' < .nvmrc)"; have="$(node -p 'process.versions.node.split(".")[0]')"
          node --version; [ "$have" = "$want" ] || { echo "::error::The runner has Node $have but .nvmrc pins major $want"; exit 1; }
      - name: Install
        working-directory: src
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: src
        run: npm test
      # The release zip is built with `git archive`, so it ships the *committed* kernel, not the one built
      # during the release. A stale commit therefore reaches local-mode devices silently. Fail the build instead.
      - name: Local kernel and generated schema match their sources
        working-directory: src
        run: |
          npm run build:local
          git diff --exit-code -- public/local server/schema-text.js public/sw.js || {
            echo "::error::public/local/kernel.js or server/schema-text.js is out of date. Run 'npm run build:local' and commit the result."
            exit 1
          }
      - name: Package
        working-directory: src
        run: node scripts/package.js /tmp/suds.zip
      - name: Syntax-check browser modules
        working-directory: src
        run: for f in public/*.js public/views/*.js; do node --input-type=module --check < "$f" || exit 1; done
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
      - name: Node major matches .nvmrc
        working-directory: src
        run: |
          want="$(tr -d '[:space:]' < .nvmrc)"; have="$(node -p 'process.versions.node.split(".")[0]')"
          node --version; [ "$have" = "$want" ] || { echo "::error::The runner has Node $have but .nvmrc pins major $want"; exit 1; }
      - name: Install Playwright (test-only)
        working-directory: src
        run: npm ci --no-audit --no-fund && npm i --no-save --no-audit --no-fund playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Browser regression suite
        working-directory: src
        run: npm run build:local && scripts/ui/run-all.sh
  # Node 22 leaves maintenance in April 2027 and node:sqlite is still experimental, so the suite also runs on
  # the next LTS line to catch breakage early (docs/DEPLOYMENT.md, "Node.js support and the move to 24").
  # Advisory only: a failure here does not fail the build until .nvmrc moves to 24. There is no setup-node
  # action (marketplace actions are off), so the official tarball is downloaded and checked against SHASUMS.
  node24:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
      - name: Install Node 24 (official tarball, checksum verified)
        run: |
          base=https://nodejs.org/dist/latest-v24.x
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/SHASUMS256.txt"
          file="$(grep -o 'node-v24\.[0-9.]*-linux-x64\.tar\.xz' SHASUMS256.txt | head -1)"
          [ -n "$file" ] || { echo "::error::No linux-x64 tarball listed in $base/SHASUMS256.txt"; exit 1; }
          curl -fsSLO "$base/$file"
          grep " $file\$" SHASUMS256.txt | sha256sum -c -
          mkdir -p node24 && tar -xJf "$file" -C node24 --strip-components=1
          echo "$RUNNER_TEMP/node24/bin" >> "$GITHUB_PATH"
      - name: Install
        working-directory: src
        run: node --version && npm ci --no-audit --no-fund
      - name: Test on Node 24
        working-directory: src
        run: npm test
  # The browser suite drives Chromium; iPhones run WebKit. This smoke subset runs the two phone-shaped
  # scripts (the static build and the tester's retest, both on an iPhone 13 profile) in Playwright's WebKit.
  # Advisory while it beds in (continue-on-error). Playwright's WebKit on Linux is not iOS Safari, so the
  # real-device release checklist (docs/ADOPTION.md) still applies.
  webkit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" src && cd src && git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout "${GITHUB_SHA}"
      - name: Install Playwright WebKit (test-only)
        working-directory: src
        run: npm ci --no-audit --no-fund && npm i --no-save --no-audit --no-fund playwright@1.56.1 && npx playwright install --with-deps webkit
      - name: WebKit smoke subset
        working-directory: src
        env:
          SUDS_BROWSER: webkit
          SCRIPTS: static-site qa-retest
        run: npm run build:local && scripts/ui/run-all.sh
